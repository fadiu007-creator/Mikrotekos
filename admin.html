<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin inbox · MikroTekos</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111827;--line:#263247;--text:#f4f7fb;--muted:#9ba9bd;--lime:#d9ff72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto}.nav{padding:18px 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}.brand b{color:var(--lime)}h1{letter-spacing:-.04em}.muted{color:var(--muted)}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn,select{background:#172338;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px}.btn{cursor:pointer}.status{padding:12px 0;overflow-wrap:anywhere}
</style></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Mikro<b>Tekos</b></a> · <a href="account.html">Llogaria / Account</a></div></header><main class="wrap"><h1>Service request inbox</h1><p class="muted">Only accounts with server-assigned app_metadata.role = admin can read or update requests.</p><div id="status" class="status">Duke u lidhur… / Connecting…</div><div id="requests"></div></main><script src="backend-config.js"></script><script src="backend.js"></script><script>
const $=s=>document.querySelector(s);function say(s){$('#status').textContent=s}
const labels={received:'Received',reviewing:'Reviewing',quoted:'Quoted',accepted:'Accepted',in_progress:'In progress',completed:'Completed',declined:'Declined'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const db=await window.MT_READY;const {data:{session}}=await db.auth.getSession();if(!session){say('Hyr në fillim. / Please sign in first.');return}if(session.user.app_metadata?.role!=='admin'){say('Nuk ke leje administratori. Roli caktohet në mënyrë të sigurt në Supabase. / No admin access. Admin role must be assigned securely in Supabase.');return}const {data,error}=await db.from('mikrotekos_service_requests').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;say(data.length+' kërkesa / requests');$('#requests').innerHTML=data.map(r=>'<article class="item"><div class="top"><div><strong>'+esc(r.service_type)+'</strong><div class="muted">'+esc(r.customer_name)+' · '+esc(r.customer_email)+' · '+new Date(r.created_at).toLocaleString()+'</div></div><select data-status="'+r.id+'">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(r.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><p style="white-space:pre-wrap">'+esc(r.details)+'</p><div class="muted">Language: '+esc(r.language)+' · ID: '+esc(r.id)+'</div><button class="btn" data-save="'+r.id+'">Save status</button></article>').join('')||'<p>No requests yet.</p>';$('#requests').querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.save, status=$('[data-status="'+id+'"]').value;const {error}=await db.from('mikrotekos_service_requests').update({status}).eq('id',id);if(error)say(error.message);else say('Status saved: '+labels[status])}))}catch(e){say(e.message)}}
load();
</script></body></html>
