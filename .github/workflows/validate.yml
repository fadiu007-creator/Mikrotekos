name: Validate static app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax and workspace markers
        run: node tests/check-inline-scripts.mjs
      - name: Check whitespace errors
        run: git diff --check
