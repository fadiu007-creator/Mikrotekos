<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Website · MikroTekos</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:light;--accent:#d9ff72}*{box-sizing:border-box}body{margin:0;font:17px/1.65 system-ui,sans-serif;background:#f7f8fb;color:#172033}.bar{padding:15px 20px;border-bottom:1px solid #e2e8f0;font-size:.9rem}.bar a{color:#172033}.site{width:min(900px,calc(100% - 36px));margin:0 auto;padding:70px 0}.site h1{font-size:clamp(2.5rem,7vw,5.2rem);line-height:1.03;letter-spacing:-.06em;margin:0 0 22px}.site p{font-size:1.2rem;max-width:700px;color:#4b5563;white-space:pre-wrap}.cta{display:inline-block;background:var(--accent);color:#10150a;padding:13px 20px;border-radius:999px;text-decoration:none;font-weight:800;margin-top:20px}.foot{margin-top:90px;color:#64748b;font-size:.85rem}
</style></head><body><header class="bar"><a href="index.html">MikroTekos · Website</a></header><main class="site"><div id="status">Loading website…</div><article id="content" hidden><h1 id="headline"></h1><p id="description"></p><a id="cta" class="cta" hidden>Contact</a><div class="foot" id="brand"></div></article></main><script src="backend-config.js"></script><script src="backend.js"></script><script>
(async()=>{const $=s=>document.querySelector(s);const status=$('#status');try{const slug=new URLSearchParams(location.search).get('slug');if(!slug){status.textContent='Website slug missing.';return}const db=await window.MT_READY;const {data,error}=await db.from('mikrotekos_published_sites').select('title,slug,content,status').eq('slug',slug).eq('status','published').maybeSingle();if(error)throw error;if(!data){status.textContent='This page does not exist or is not published.';return}const c=data.content||{};document.title=data.title+' · MikroTekos';document.documentElement.style.setProperty('--accent',/^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:'#d9ff72');$('#headline').textContent=c.headline||data.title;$('#description').textContent=c.description||'';$('#brand').textContent=data.title+' · Made with MikroTekos';if(typeof c.email==='string'&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)){const a=$('#cta');a.href='mailto:'+c.email;a.textContent='Contact '+c.email;a.hidden=false}$('#content').hidden=false;status.remove()}catch(e){status.textContent='Unable to load page: '+e.message}})();
</script></body></html>
