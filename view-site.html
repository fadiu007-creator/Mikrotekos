<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="Business website published with MikroTekos."><meta property="og:type" content="website"><meta property="og:title" content="Website · MikroTekos"><meta property="og:description" content="Business website published with MikroTekos."><title>Website · MikroTekos</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
:root{--accent:#d9ff72;--ink:#172033;--muted:#596579;--surface:#f7f8fb;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font:17px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--surface);color:var(--ink)}a{color:inherit}.bar{padding:14px 20px;border-bottom:1px solid var(--line);font-size:.9rem;background:#ffffffd9}.bar a{text-decoration:none}.site{width:min(1000px,calc(100% - 36px));margin:0 auto;padding:30px 0 60px}.sitehead{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:1.1rem}.logo{max-width:150px;max-height:70px;object-fit:contain}.city{color:var(--muted)}.hero{padding:clamp(40px,8vw,90px) 0 50px}.kicker{color:var(--muted);font-size:.9rem}.hero h1{font-size:clamp(2.5rem,7vw,5.2rem);line-height:1.03;letter-spacing:-.06em;margin:10px 0 20px;max-width:900px}.hero p{font-size:1.15rem;max-width:760px;white-space:pre-wrap;color:#4b5563}.cta{display:inline-block;background:var(--accent);color:#10150a;padding:13px 20px;border-radius:10px;text-decoration:none;font-weight:850;margin-top:12px}.services{padding:20px 0 45px}.services h2,.contact h2{font-size:1.7rem;letter-spacing:-.04em}.servicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.service{padding:18px;border:1px solid var(--line);border-radius:14px;background:white}.service h3{margin:0 0 5px}.price{font-weight:850;color:#1f2937}.contact{padding:24px;background:white;border:1px solid var(--line);border-radius:18px;margin:20px 0}.contact p{overflow-wrap:anywhere}.contact a{color:#174a8b}.foot{margin-top:45px;padding-top:18px;border-top:1px solid var(--line);color:#64748b;font-size:.85rem}.template-bold .sitehead{background:#111827;color:#fff;padding:22px;border-radius:14px;border:0}.template-bold .hero{padding-top:55px}.template-bold .hero h1{max-width:720px}.template-elegant{font-family:Georgia,"Times New Roman",serif}.template-elegant .hero h1{font-weight:500}.template-minimal .sitehead{border:0}.status{padding:70px 0;color:var(--muted)}@media(max-width:600px){.sitehead{align-items:flex-start;flex-direction:column}.site{padding-top:12px}.contact{padding:18px}}@media print{.bar{display:none}.site{width:100%;padding:0}.cta{border:1px solid #aaa}}
</style></head><body><header class="bar"><a href="index.html">MikroTekos · Website</a></header><main class="site"><div id="status" class="status">Loading website…</div><article id="content" hidden><header class="sitehead"><strong id="brand" class="brand"></strong><img id="logo" class="logo" hidden alt=""><span id="city" class="city"></span></header><section class="hero"><div id="kicker" class="kicker"></div><h1 id="headline"></h1><p id="description"></p><a id="cta" class="cta" hidden></a></section><section id="services" class="services" hidden><h2 id="servicesTitle"></h2><div id="serviceGrid" class="servicegrid"></div></section><section class="contact"><h2 id="contactTitle">Contact</h2><div id="contactDetails"></div></section><footer id="footer" class="foot"></footer></article></main>
<script src="backend-config.js"></script><script src="backend.js"></script><script>
(async function(){
const $=id=>document.getElementById(id);
const text=(id,v)=>{$(id).textContent=v||""};
function addLink(parent,label,href){const p=document.createElement("p"),a=document.createElement("a");a.textContent=label;a.href=href;if(/^https:/.test(href)){a.target="_blank";a.rel="noopener noreferrer"}p.appendChild(a);parent.appendChild(p)}
try{const slug=new URLSearchParams(location.search).get("slug");if(!slug){text("status","Website slug missing.");return}const db=await window.MT_READY;const q=await db.from("mikrotekos_published_sites").select("title,slug,content,status,published_at").eq("slug",slug).eq("status","published").maybeSingle();if(q.error)throw q.error;if(!q.data){text("status","This page does not exist or is not published.");return}const data=q.data,c=data.content||{},lang=["sq","en","sr"].includes(c.language)?c.language:"sq",name=data.title;
document.documentElement.lang=lang;document.title=(c.seo_title||name)+" · "+name;document.querySelector('meta[name="description"]').content=(c.seo_description||c.description||"").slice(0,300);document.querySelector('meta[property="og:title"]').content=c.seo_title||name;document.querySelector('meta[property="og:description"]').content=(c.seo_description||c.description||"").slice(0,300);
const accent=/^#[0-9a-f]{6}$/i.test(c.color||"")?c.color:"#d9ff72";document.documentElement.style.setProperty("--accent",accent);$("content").classList.add("template-"+(["minimal","bold","elegant"].includes(c.template)?c.template:"minimal"));text("brand",name);text("city",c.city||"");text("kicker",c.business_type||"");text("headline",c.headline||name);text("description",c.description||"");text("footer",name+" · Made with MikroTekos");
if(c.logo){try{const u=new URL(c.logo);if(["https:","http:"].includes(u.protocol)){$("logo").src=u.href;$("logo").alt=name+" logo";$("logo").hidden=false;$("brand").hidden=true}}catch{}}
const services=Array.isArray(c.services)?c.services:[];if(services.length){$("services").hidden=false;text("servicesTitle",lang==="en"?"Services & products":lang==="sr"?"Usluge i proizvodi":"Shërbimet dhe produktet");for(const item of services.slice(0,50)){const s=typeof item==="string"?{name:item,price:""}:item;const card=document.createElement("article");card.className="service";const h=document.createElement("h3");h.textContent=String(s.name||"").slice(0,300);card.appendChild(h);if(s.price){const p=document.createElement("p");p.className="price";p.textContent=String(s.price).slice(0,100);card.appendChild(p)}$("serviceGrid").appendChild(card)}}
text("contactTitle",lang==="en"?"Contact":lang==="sr"?"Kontakt":"Kontakti");const box=$("contactDetails");
if(c.address){const p=document.createElement("p");p.textContent="⌖ "+String(c.address).slice(0,300)+(c.city?", "+String(c.city).slice(0,120):"");box.appendChild(p);addLink(box,lang==="en"?"Open map ↗":lang==="sr"?"Otvori mapu ↗":"Hape hartën ↗","https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.address+(c.city?", "+c.city:"")))}
if(c.hours){const p=document.createElement("p");p.textContent="◷ "+String(c.hours).slice(0,300);box.appendChild(p)}
if(typeof c.email==="string"&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email))addLink(box,c.email,"mailto:"+c.email);
if(typeof c.phone==="string"&&c.phone.trim())addLink(box,c.phone,"tel:"+c.phone.replace(/[^\d+]/g,""));
if(typeof c.whatsapp==="string"&&c.whatsapp.replace(/\D/g,"").length>=7)addLink(box,"WhatsApp","https://wa.me/"+c.whatsapp.replace(/\D/g,""));
if(!box.children.length){const p=document.createElement("p");p.textContent=lang==="en"?"Add contact details to this website.":lang==="sr"?"Dodajte kontakt podatke na ovu stranicu.":"Shtoni të dhënat e kontaktit në këtë faqe.";box.appendChild(p)}
if(c.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)){$("cta").href="mailto:"+c.email;$("cta").textContent=lang==="en"?"Contact us":lang==="sr"?"Kontaktirajte nas":"Na kontakto";$("cta").hidden=false}else if(c.whatsapp&&c.whatsapp.replace(/\D/g,"").length>=7){$("cta").href="https://wa.me/"+c.whatsapp.replace(/\D/g,"");$("cta").target="_blank";$("cta").rel="noopener noreferrer";$("cta").textContent="WhatsApp";$("cta").hidden=false}
$("content").hidden=false;$("status").remove()
}catch(e){text("status","Unable to load website: "+(e.message||"unknown error"))}
})();
</script></body></html>
